[core]
	engine = pg
	plan_file = sqitch.plan
	top_dir = .

[engine "pg"]
	registry = sqitch
	client = psql

[target "local"]
	uri = db:pg://depopdba@local/postgres

[target "dev"]
	uri = db:pg://depopdba@dev/postgres

[target "staging"]
	uri = db:pg://depopdba@REPLACE_ME/postgres

[target "production"]
	uri = db:pg://depopdba@REPLACE_ME/postgres
