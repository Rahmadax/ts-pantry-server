environment: staging
accountName: services-staging
accountTag: stage-svcs
service_domain: user
service_group: default
service_name: dispute
service_role: workflow

dns_override_fqdn: disputes-stage.depop.systems

loadbalancer:
  port: 9000
  alb:
    access_log_bucket: us-east-1-stage-svcs-elb-access-logs
    certificate: arn:aws:acm:us-east-1:183284569534:certificate/04efed22-1a3c-4d1c-b644-7ef61dc11e95,arn:aws:acm:us-east-1:183284569534:certificate/e0a438f1-911e-4916-9be0-92cbd99e573e
    enabled: true

resources:
  limits:
    memory: 12Gi
  requests:
    memory: 12Gi
    cpu: 250m

secrets:
  ENV_DB_PASSWORD: staging/services/user/default/dispute/workflow/_default/postgres_app_password
  ENV_OKTA_CLIENT_ID: staging/services/user/default/dispute/workflow/_default/okta_client_id
  ENV_OKTA_CLIENT_SECRET: staging/services/user/default/dispute/workflow/_default/okta_client_secret
  ENV_DEPOP_CLIENT_ID: staging/services/user/default/dispute/workflow/_default/depop_client_id
  ENV_DEPOP_CLIENT_SECRET: staging/services/user/default/dispute/workflow/_default/depop_client_secret
  ENV_SHIPPING_API_SECRET: staging/services/user/default/dispute/workflow/_default/shipping_api_secret
  ENV_API_USERNAME: staging/services/user/default/dispute/workflow/_default/api_username
  ENV_API_PASSWORD: staging/services/user/default/dispute/workflow/_default/api_password
serviceConfig:
  JAVA_OPTS: -Dpolyglot.engine.WarnInterpreterOnly=false
  SPRING_PROFILES_ACTIVE: stage_deployment
  ENV_DB_URL: jdbc:postgresql://service-user-default-dispute-workflow.cnrpoumyfd1x.us-east-1.rds.amazonaws.com/disputeworkflow?options=-c%20statement_timeout=90000
  ENV_DB_USER: disputeworkflow_app
  ENV_OKTA_CLIENT_ISSUER_URI: https://depop.okta.com
  ENV_OKTA_CLIENT_REDIRECT_URI: https://disputes-stage.depop.systems
  ENV_OAUTH2_RESOURCE_SERVER_JWK_SET_URI: https://security-default-clientauth-api.eks-default.stage-app.dpop.co.uk/.well-known/jwks.json
  ENV_OAUTH2_RESOURCE_SERVER_ISSUER_URI: depop-oauth-introspection
  ENV_DEPOP_CLIENT_TOKEN_URL: https://security-default-clientauth-api.eks-default.stage-app.dpop.co.uk/oauth2/access_token/
  CHECKOUT_HOST: https://checkout-default-checkout-server.eks-default.stage-app.dpop.co.uk
  DRC_HOST: https://user-default-dispute-internal.eks-default.stage-app.dpop.co.uk
  PAYMENTS_HOST: https://payments-default-payments-api.eks-default.stage-app.dpop.co.uk/
  SHIPPING_HOST: https://fulfilment-default-shipping-internal.eks-default.stage-app.dpop.co.uk
  USER_HOST: https://django-default-django-api.eks-default.stage-app.dpop.co.uk
  COMMS_HOST: http://comms-hub.martech-default
  PICTURE_HOST: https://media-default-picture-api.eks-default.stage-app.dpop.co.uk
  PRODUCT_HOST: https://django-default-django-api.eks-default.stage-app.dpop.co.uk
  BLOCKING_HOST: https://blocking-default-blocking-internal.eks-default.stage-app.dpop.co.uk
  ADDRESS_HOST: https://fulfilment-default-address-internal.eks-default.stage-app.dpop.co.uk
  RETURNS_HOST: https://user-default-returns-internal.eks-default.stage-app.dpop.co.uk
autoscaling:
  cpu: 65
  memory: 75
  minReplicas: 3
  maxReplicas: 4

chart:
  name: generic-service
  version: ^2

datadogTracing:
  agent:
    enabled: false
