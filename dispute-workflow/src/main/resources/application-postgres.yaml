# common
spring:
  output:
    ansi:
      enabled: ALWAYS
  jpa:
    hibernate:
      ddl-auto: create
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: "jdbc:postgresql://localhost:5432/disputeworkflow"
    username: depopdba
    password: depopdba

---

# dev profile
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: "jdbc:postgresql://localhost:5432/disputeworkflow"
    username: disputeworkflow
    password: disputeworkflow

---

# stage profile
spring:
  config:
    activate:
      on-profile: stage
  datasource:
    url: ${ENV_DB_URL}
    username: ${ENV_DB_USER}
    password: ${ENV_DB_PASSWORD}

---

# production profile
spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${ENV_DB_URL}
    username: ${ENV_DB_USER}
    password: ${ENV_DB_PASSWORD}