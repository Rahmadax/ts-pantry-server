# common
spring:
  jersey:
    application-path: /internal/v1

camunda:
  bpm:
    database:
      schema-update: false
    deployment-resource-pattern: classpath*:com/depop/cx/drc/workflow/*.bpmn
    default-serialization-format: application/json

---

# h2 profile
spring:
  config:
    activate:
      on-profile: h2
camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
    database:
      schema-update: true

---

# local profile
spring:
  config:
    activate:
      on-profile: local

---

# stage profile
spring:
  config:
    activate:
      on-profile: stage

---

# production profile
spring:
  config:
    activate:
      on-profile: production
