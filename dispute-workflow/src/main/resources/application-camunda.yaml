# common
spring:
  jersey:
    application-path: /internal/v1

camunda:
  bpm:
    authorization:
      enabled: false
      tenant-check-enabled: false
    database:
      schema-update: false
    deployment-resource-pattern: classpath*:com/depop/cx/drc/workflow/*.bpmn
    default-serialization-format: application/json
    job-execution:
      max-wait: 1000
      wait-time-in-millis: 100
      max-jobs-per-acquisition: 1

---

# h2 profile
spring:
  config:
    activate:
      on-profile: h2
camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
    database:
      schema-update: true

---

# local profile
spring:
  config:
    activate:
      on-profile: local

---

# stage profile
spring:
  config:
    activate:
      on-profile: stage

---

# production profile
spring:
  config:
    activate:
      on-profile: production
