# common
spring:
  jersey:
    application-path: /internal/v1

camunda:
  bpm:
    authorization:
      enabled: false
      tenant-check-enabled: false
    database:
      schema-update: false
    deployment-resource-pattern: classpath*:com/depop/cx/drc/workflow/*.bpmn
    default-serialization-format: application/json

---

# h2 profile
spring:
  config:
    activate:
      on-profile: h2
camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
    database:
      schema-update: true
    generic-properties:
      properties:
        historyRemovalTimeStrategy: "start"

---

# local profile
spring:
  config:
    activate:
      on-profile: local

---

# stage profile
spring:
  config:
    activate:
      on-profile: stage
camunda:
  bpm:
    generic-properties:
      properties:
        historyTimeToLive: P30D
        historyCleanupJobLogTimeToLive: P7D
        historyCleanupBatchWindowStartTime: "00:00"
        historyCleanupBatchWindowEndTime: "09:00"

---

# production profile
spring:
  config:
    activate:
      on-profile: production
camunda:
  bpm:
    generic-properties:
      properties:
        historyTimeToLive: P180D
        historyCleanupJobLogTimeToLive: P7D
        historyCleanupBatchWindowStartTime: "05:00"
        historyCleanupBatchWindowEndTime: "11:00"
