# common
spring:
  output:
    ansi:
      enabled: ALWAYS
  profiles:
    active: local-m2
    group:
      local-m2: metrics,m2,local
      local-postgres: metrics,postgres,local

camunda.bpm:
  admin-user:
    id: demo
    password: demo
    firstName: Demo
  deployment-resource-pattern: classpath*:com/depop/cx/drc/workflow/*.bpmn


#TODO: add opentelemetry trace fields
logging:
  register-shutdown-hook: true
  pattern:
    console: '%clr(%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(${PID: }){magenta} %clr(---){faint} %clr([%t]){faint} %clr([%X]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}'


---

# local profile
spring:
  config:
    activate:
      on-profile: local
management:
  metrics:
    export:
      datadog:
        enabled: false

---

# stage profile
spring:
  config:
    activate:
      on-profile: stage

---

# production profile
spring:
  config:
    activate:
      on-profile: production



